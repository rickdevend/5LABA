name: Security Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run Bandit (SAST)
        run: bandit -r .

      - name: Run ZAP (DAST)
        run: |
          docker run -u zap -p 8080:8080 -d owasp/zap2docker-stable zap.sh -daemon -port 8080 -host 0.0.0.0
          sleep 15
          zap-cli -p 8080 status -t 60
          zap-cli -p 8080 open-url http://localhost:5000/api/users || true
          zap-cli -p 8080 spider http://localhost:5000 || true
          zap-cli -p 8080 active-scan http://localhost:5000 || true
          zap-cli -p 8080 report -o zap_report.html -f html || true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap_report.html